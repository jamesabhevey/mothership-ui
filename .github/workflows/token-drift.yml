name: Check Figma token drift

on:
  # Monday mornings, and on demand.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = compare both modes and open a PR if they differ; diagnose = test Figma access'
        type: choice
        default: check
        options: [check, diagnose]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: token-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Compare Figma against the committed tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Prints HTTP status codes only — never a secret value. Lengths are shown
      # so a truncated or newline-mangled secret is visible without revealing it.
      - name: Diagnose Figma access
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          echo "token length:    ${#FIGMA_TOKEN}   (Figma tokens are ~40+ chars and start figd_)"
          echo "file key length: ${#FIGMA_FILE_KEY}   (expected 22)"
          case "$FIGMA_TOKEN" in
            figd_*) echo "token prefix:    looks like a Figma token" ;;
            *)      echo "token prefix:    NOT figd_ — wrong value?" ;;
          esac
          echo
          code() { curl -s -o /dev/null -w "%{http_code}" -H "X-Figma-Token: $FIGMA_TOKEN" "$1"; }
          echo "GET /v1/me                     -> $(code https://api.figma.com/v1/me)   (tests the token alone)"
          echo "GET /v1/files/KEY              -> $(code https://api.figma.com/v1/files/$FIGMA_FILE_KEY)   (tests token + file access)"
          echo "GET /v1/files/KEY/nodes        -> $(code "https://api.figma.com/v1/files/$FIGMA_FILE_KEY/nodes?ids=18:197")"
          echo "GET /v1/files/KEY/variables    -> $(code https://api.figma.com/v1/files/$FIGMA_FILE_KEY/variables/local)   (Enterprise only)"
          echo
          echo "200 = fine | 403 = token or scope problem | 404 = wrong file key"

      # Reads the Foundations / Colour page through the ordinary file endpoint,
      # which works on any Figma plan, and compares every colour token's light
      # and dark value against tokens.json.
      - name: Run the drift check
        id: drift
        if: ${{ inputs.mode != 'diagnose' }}
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          set -o pipefail
          node scripts/check-figma-drift.mjs --write | tee drift-report.txt

      # The report always comes out, so a failed or empty run is still readable.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: figma-drift
          path: |
            drift-report.txt
            tokens/tokens.json
          if-no-files-found: warn

      # Writes both stylesheets: the components' and the copy the Storybook
      # manager loads. Committing only one would leave the chrome on stale
      # values and fail the contract checks on the pull request.
      - name: Regenerate the stylesheets if tokens changed
        if: ${{ (inputs.mode || 'check') == 'check' }}
        run: npm run tokens

      - name: Check the library still builds
        if: ${{ (inputs.mode || 'check') == 'check' }}
        run: npm run typecheck && npm run build

      - name: Open a pull request if anything drifted
        if: ${{ (inputs.mode || 'check') == 'check' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- tokens/tokens.json src/styles/tokens.css public/manager-tokens.css; then
            echo "No drift. Nothing to open."
            exit 0
          fi

          BRANCH="tokens/figma-drift-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tokens/tokens.json src/styles/tokens.css public/manager-tokens.css
          git commit -m "Update design tokens to match Figma"
          git push -u origin "$BRANCH"

          {
            echo "Figma and the code disagree on the colour values below. This brings the code"
            echo "into line."
            echo
            echo "Both modes are compared. The values are read by name from the Foundations /"
            echo "Colour page, where each token has a Light and a Dark swatch pinned to its mode,"
            echo "because the endpoint that would return variable definitions directly needs an"
            echo "Enterprise plan."
            echo
            echo "Every component refers to these tokens by name, so no component code changes."
            echo "Type-check and build passed before this was opened."
            echo
            echo "Tokens added or removed in Figma are reported but never applied here — a new"
            echo "token needs a name, a place on the Colour page and a decision about what it is"
            echo "for. If the report below lists any, they need a person."
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
          } > pr-body.md

          gh pr create \
            --title "Update design tokens to match Figma" \
            --body-file pr-body.md \
            --base main \
            --head "$BRANCH"

      # A hard-coded colour cannot be fixed from here — it needs a layer in
      # Figma bound to a variable, or a new token. No pull request would carry
      # it, so the run goes red instead and says why.
      - name: Fail if anything needs a person
        if: ${{ (inputs.mode || 'check') == 'check' }}
        run: |
          if grep -q "NEEDS A PERSON" drift-report.txt; then
            echo "::error::Colours painted in the Figma components are not in the palette. See the run log or the figma-drift artifact."
            exit 1
          fi
          echo "Nothing needs a person."
