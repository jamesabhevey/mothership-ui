# One-off, run by hand: works out whether the Dark mode values can be read out
# of the Figma file with the access this plan has.
#
# It exists as a workflow because the Figma token lives in this repository's
# secrets and nowhere else, so anything that reads Figma has to run here.
# Structure only — page, frame and mode names — never any part of the token.
name: Probe Figma for dark mode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Look for dark mode artwork
        run: node scripts/probe-figma-modes.mjs
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}

      - name: Read every token's Light and Dark value
        run: node scripts/sync-figma-modes.mjs
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
