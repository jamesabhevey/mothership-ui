# Publish to npm when a version tag is pushed.
#
#   npm version minor && git push --follow-tags
#
# Releases are deliberately tag-driven rather than automatic on every push. Once
# a version is on npm it is permanent and somebody's lockfile points at it, so
# cutting one should be a decision rather than a side effect of merging.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Lets npm attach a provenance attestation, so anyone installing this can see
  # which workflow run and which commit produced the tarball.
  id-token: write

jobs:
  publish:
    name: Build, check and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The Changelog page is built from history; the default shallow
          # checkout would give it one entry.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The tag is the source of truth for what is being released. A tag that
      # disagrees with package.json means one of the two was not updated, and
      # publishing either of them would be wrong.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

      - run: npm run typecheck

      # The same gate every push gets. A release should never be the first time
      # these run.
      - name: Contract checks
        run: |
          npm run build-storybook
          npm run check
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Accessibility
        # Also run on every push and pull request. Repeated here because a tag
        # can be pushed from anywhere, and a release is the one build where
        # "it passed on main" is not good enough.
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Build the package
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
