# Publish to GitHub Packages when a version tag is pushed.
#
#   npm version minor && git push --follow-tags
#
# Releases are deliberately tag-driven rather than automatic on every push. Once
# a version is published it is permanent and somebody's lockfile points at it,
# so cutting one should be a decision rather than a side effect of merging.
#
# GitHub Packages rather than npmjs.com because the package is YLD-only. It
# needs no secret at all: GITHUB_TOKEN is minted for each run and already has
# permission to publish to this repository's own organisation. The scope has to
# match that organisation exactly, which is why the package is @yldio and not
# @yld.
name: Publish to GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Lets GITHUB_TOKEN publish a package belonging to this repository.
  packages: write

jobs:
  publish:
    name: Build, check and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The Changelog page is built from history; the default shallow
          # checkout would give it one entry.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@yldio'

      - run: npm ci

      # The tag is the source of truth for what is being released. A tag that
      # disagrees with package.json means one of the two was not updated, and
      # publishing either of them would be wrong.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

      - run: npm run typecheck

      # The same gate every push gets. A release should never be the first time
      # these run.
      - name: Contract checks
        run: |
          npm run build-storybook
          npm run check
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Accessibility
        # Also run on every push and pull request. Repeated here because a tag
        # can be pushed from anywhere, and a release is the one build where
        # "it passed on main" is not good enough.
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Build the package
        run: npm run build

      - name: Publish
        # No --access flag: packages here inherit the repository's visibility,
        # and the repository is private. No provenance attestation either —
        # that is an npmjs.com feature and GitHub Packages does not take one.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
