# Read the Light and Dark value of every colour token out of the Figma file.
#
# Run by hand after the palette changes in Figma. It prints JSON; the values go
# into tokens/tokens.json, and `npm run tokens` regenerates the stylesheets.
#
# It lives here rather than as a local script because the Figma token is in this
# repository's secrets and nowhere else. The output is colour values only.
name: Read Figma colour modes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    name: Read modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read every token's Light and Dark value
        run: node scripts/sync-figma-modes.mjs
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
