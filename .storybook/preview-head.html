<!--
  Injected into the preview iframe, which is where the generated docs pages
  render. The manager theme cannot reach in here, so Storybook's own controls
  on those pages — Show code, Copy code, the story toolbar and the args table —
  need the same hover and pressed treatment applied separately.

  Scoped deliberately tightly to Storybook's chrome. A blanket `.sbdocs button`
  would also catch the library's own Buttons rendered inside a docs page and
  turn them grey on hover.

  Selectors are deliberately one level deeper than Storybook's own. Its rules
  are a single class plus a pseudo-class, and Emotion injects them at runtime,
  after this block — on an equal-specificity tie the later rule wins, so these
  need to out-specify rather than merely match.
-->
<style>
  /*
    Colour as well as background. Storybook's rule for these buttons is
    `color: #8429cc; background: rgba(132,41,204,.14)` on hover, and replacing
    only the background left the label and its icon turning brand purple against
    a neutral fill. Both now go to text/primary, one step darker than the
    text/muted they sit at when idle, so hover reads as the label coming forward
    rather than changing meaning. The icons are currentColor, so they follow.
  */
  .sbdocs-preview-actions .docblock-code-toggle:hover,
  .sbdocs-preview-actions button:hover,
  .docblock-argstable button:hover,
  .sb-bar button:hover {
    background-color: var(--color-border-subtle);
    color: var(--color-text-primary);
  }

  .sbdocs-preview-actions .docblock-code-toggle:active,
  .sbdocs-preview-actions button:active,
  .docblock-argstable button:active,
  .sb-bar button:active {
    background-color: var(--color-border-default);
    color: var(--color-text-primary);
  }

  /*
    Generated docs pages default to a 1000px content column. Narrowed to 960 so
    they line up with the Welcome, Get started, Catalog, Foundations and Assets
    pages, which set their own width.
  */
  .sbdocs-wrapper .sbdocs-content {
    max-width: 960px;
  }

  /*
    Section headings on the generated docs pages.

    A component page nests its headings page title → "Stories" → one per story.
    Storybook sets the middle one as a 13px uppercase label with 4.5px of
    tracking, which is the one piece of shouted type left in here and reads as a
    divider rather than the section heading it actually is.

    It is brought onto our scale at type/heading/md — 24/32, -0.3px — matching
    the section headings on the Welcome, Get started, Catalog, Foundations and
    Assets pages, so a section heading is one size wherever it appears. Casing
    and tracking come off for the same reason they did in the sidebar.

    Story names below it stay at Storybook's 20/30, a step down, so the nesting
    still reads. Weight and the surrounding margins are left alone.

    Targeted structurally — the class on the element is a generated Emotion one
    that changes between builds — and with enough specificity to win against it.
  */
  .sbdocs-wrapper .sbdocs-content h2 {
    font-size: 24px;
    line-height: 32px;
    letter-spacing: -0.3px;
    text-transform: none;
  }
</style>

<style>
  /*
    Storybook's own docs chrome, painted from the tokens.
    ------------------------------------------------------------------
    Everything below was a literal from Storybook's docs theme — white
    backgrounds, #1f2429 prose, #e8eaec rules. Those are correct in light and
    wrong in dark, and the docs theme is handed over once at build time, so it
    cannot follow a toolbar toggle.

    So each one is pointed at the token that already held that value. Light
    renders exactly as before; dark follows because the token does. No rule here
    is gated on [data-theme] — the variable does the switching, which is the
    same trick the components use.

    Two small departures, both improvements rather than accidents: inline code
    picks up bg/subtle in place of Storybook's slightly blue #f6f9fc, and it
    loses the 0.9 alpha on its text.

    Left alone deliberately: the syntax-highlighted code blocks, which are dark
    in Storybook's light theme too and read fine in both.
  */
  /*
    Specificity, because these all fight Storybook's own rules. Its docs styles
    are Emotion classes injected at runtime, after this block, so an equal tie
    goes to Storybook. Worse, the args table doubles its own class
    (`.css-x.css-x tbody > tr > *`) specifically to win ties, so ours has to
    out-weigh a doubled class rather than merely match one — hence the otherwise
    redundant `.sbdocs` and the repeated `.docblock-argstable`, which is the
    same trick used back.
  */
  .sbdocs.sbdocs-wrapper {
    background-color: var(--color-bg-default);
  }

  .sbdocs-wrapper .sbdocs-content :is(h1, h2, h3, h4, h5, h6, p, li, strong, em, blockquote, dt, dd) {
    color: var(--color-text-primary);
  }

  .sbdocs-wrapper .sbdocs-content a:not([class*='sbdocs-preview'] a) {
    color: var(--color-text-link);
  }

  .sbdocs-wrapper .sbdocs-content :is(p, li, td, h1, h2, h3) > code {
    background-color: var(--color-bg-subtle);
    border-color: var(--color-border-subtle);
    color: var(--color-text-primary);
  }

  /* The framed story preview and the block of actions beneath it. */
  .sbdocs-wrapper .sbdocs-preview {
    background-color: var(--color-surface-default);
    border-color: var(--color-border-subtle);
  }

  .sbdocs-wrapper .sbdocs-preview-actions {
    border-color: var(--color-border-subtle);
    color: var(--color-text-muted);
  }

  /* The props table. */
  .sbdocs-wrapper .docblock-argstable.docblock-argstable th {
    color: var(--color-text-muted);
  }

  .sbdocs-wrapper .docblock-argstable.docblock-argstable td {
    background-color: var(--color-surface-default);
    border-color: var(--color-border-subtle);
    color: var(--color-text-primary);
  }

  /*
    The type summaries — `"sm" | "md" | "lg"` and friends — are spans carrying
    their own colour, so they do not inherit the cell's.
  */
  .sbdocs-wrapper .docblock-argstable.docblock-argstable td span {
    color: var(--color-text-primary);
  }

  /*
    Its controls are Storybook's own form elements, not the library's. In light
    they are a white field with a #d3d7db border, which is surface/default on
    border/default exactly, so naming the tokens changes nothing there.
  */
  .sbdocs-wrapper .docblock-argstable.docblock-argstable
    :is(input[type='text'], input[type='number'], select, textarea, button) {
    background-color: var(--color-surface-default);
    border-color: var(--color-border-default);
    color: var(--color-text-primary);
  }
</style>

<style>
  /*
    Contrast fixes found by sweeping the dark UI against AA.
    ------------------------------------------------------------------
    Three things failed, all of them Storybook literals that were fine on white
    and not on #0b0d0f. Each is pointed at the token holding the value it
    already had in light, so light is unchanged and dark is legible.

      Show code / Copy code   #666f78 on #0b0d0f was 3.81:1, needs 4.5
                              -> text/muted, 9.3:1 in dark, unchanged in light
      inline code in the
      props table             #1f2429 on #1f2429 — invisible. The chips are
                              nested inside a span, and the earlier rule only
                              reached a direct child of the cell
      the story preview's
      own toolbar strip       kept a white background of its own

    The syntax-highlighted blocks are deliberately excluded: they are dark in
    Storybook's light theme too and read fine in both.
  */
  .sbdocs-wrapper .sbdocs-preview-actions button,
  .sbdocs-wrapper .docblock-code-toggle {
    color: var(--color-text-muted);
  }

  .sbdocs-wrapper .sbdocs-content :not(pre) > code,
  .sbdocs-wrapper .docblock-argstable :not(pre) > code {
    background-color: var(--color-bg-subtle);
    border-color: var(--color-border-subtle);
    color: var(--color-text-primary);
  }

  .sbdocs-wrapper .sb-bar {
    background-color: var(--color-bg-default);
    border-color: var(--color-border-subtle);
  }
</style>

<style>
  /*
    The last of Storybook's light literals on the docs pages.
    ------------------------------------------------------------------
    All three were still drawing at #e8eaec or #d3d7db on a dark page: the
    hairline under the story preview's toolbar, the props table's cell borders,
    and the ring around its controls. Same treatment as everywhere else — the
    token that already held the light value, so light does not move.

    The table needs both the doubled class and `tbody > tr >` spelt out.
    Storybook's rule for those cells is `.css-x.css-x tbody > tr > *`, and
    matching only one of the two — the doubled class, or the row structure —
    still loses to it. Established by testing rather than by counting: the
    arithmetic says either should be enough, and neither is.
  */
  .sbdocs-wrapper .sbdocs-preview > div:first-child {
    box-shadow: inset 0 -1px 0 0 var(--color-border-subtle);
  }

  .sbdocs-wrapper .docblock-argstable.docblock-argstable tbody > tr > td,
  .sbdocs-wrapper .docblock-argstable.docblock-argstable tbody > tr > th,
  .sbdocs-wrapper .docblock-argstable.docblock-argstable thead > tr > th {
    border-color: var(--color-border-subtle);
  }

  .sbdocs-wrapper .docblock-argstable :is(select, input, textarea) {
    box-shadow: inset 0 0 0 1px var(--color-border-default);
  }
</style>

<style>
  /*
    The props table's corners.
    ------------------------------------------------------------------
    The component preview above it is an 8px card — radius/md — and the table
    below was a hard rectangle, so the two blocks on every component page did
    not agree.

    The table's outer edge is not a border on the table: it is drawn by the
    outer cells, and the header row sits outside it, so the rounded box is the
    tbody. With border-collapse: collapse a radius on either the table or its
    cells is ignored, so the table is switched to the separate model with no
    spacing — which changes nothing visually here, because no two adjacent cells
    both carry a border to double up — and the four corner cells take the
    radius.
  */
  .sbdocs-wrapper .docblock-argstable.docblock-argstable {
    border-collapse: separate;
    border-spacing: 0;
  }

  .sbdocs-wrapper .docblock-argstable.docblock-argstable tbody > tr:first-child > td:first-child {
    border-top-left-radius: var(--radius-md);
  }

  .sbdocs-wrapper .docblock-argstable.docblock-argstable tbody > tr:first-child > td:last-child {
    border-top-right-radius: var(--radius-md);
  }

  .sbdocs-wrapper .docblock-argstable.docblock-argstable tbody > tr:last-child > td:first-child {
    border-bottom-left-radius: var(--radius-md);
  }

  .sbdocs-wrapper .docblock-argstable.docblock-argstable tbody > tr:last-child > td:last-child {
    border-bottom-right-radius: var(--radius-md);
  }
</style>

<style>
  /*
    The cross-fade between modes.
    ------------------------------------------------------------------
    Only while the mode is actually changing. apply-theme.ts puts
    data-theme-switching on the root, forces a style resolution so the
    transition is in effect before the colours move, and takes it off again
    once the fade has run.

    Short and ease-out: long enough to read as a fade rather than a jump, quick
    enough that it never delays the reader. A colour change is feedback, not an
    event worth watching.

    A permanent transition on every element would catch every hover too, and
    would leave the browser watching thousands of nodes on pages like Glyphs and
    Catalog for something that happens now and then. !important is here to
    out-rank the components' own transition-colors for the length of the switch,
    so everything crosses at one speed rather than in waves.

    Anyone who has asked their system for less movement gets the change
    instantly instead.
  */
  :root {
    /*
      Declared once and read by apply-theme.ts, which needs the same number to
      know when to take the flag back off. Three copies of it — here, in the
      manager's copy of this block, and in the script — would eventually
      disagree, and a flag removed early cuts the fade off mid-way.
    */
    --theme-switch: 120ms;
  }

  [data-theme-switching],
  [data-theme-switching] *,
  [data-theme-switching] *::before,
  [data-theme-switching] *::after {
    transition:
      background-color var(--theme-switch) ease-out,
      border-color var(--theme-switch) ease-out,
      color var(--theme-switch) ease-out,
      fill var(--theme-switch) ease-out,
      stroke var(--theme-switch) ease-out,
      box-shadow var(--theme-switch) ease-out,
      outline-color var(--theme-switch) ease-out !important;
  }

  @media (prefers-reduced-motion: reduce) {
    [data-theme-switching],
    [data-theme-switching] *,
    [data-theme-switching] *::before,
    [data-theme-switching] *::after {
      transition: none !important;
    }
  }
</style>

<style>
  /*
    Headings at 600.
    ------------------------------------------------------------------
    Storybook's docs theme sets its headings bold. The scale has no 700 in it
    any more — Display moved to SemiBold in Figma, and everything above body was
    already 600 — so a docs page was the only place left in the Storybook
    rendering a heavier heading than the system has.
  */
  .sbdocs-wrapper .sbdocs-content :is(h1, h2, h3, h4, h5, h6) {
    font-weight: 600;
  }
</style>
