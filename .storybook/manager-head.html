<!--
  Inter for Storybook's own chrome.

  The manager is a separate document from the preview iframe, so it does not
  get the @fontsource imports in preview.ts. The four weights are served from
  public/fonts via staticDirs, and referenced relatively so the built site
  works under the /mothership-ui/ path GitHub Pages serves it from.
-->
<!--
  Browser tab icon. Served from public/ via staticDirs and referenced
  relatively, so it resolves both locally and under the /mothership-ui/ path
  GitHub Pages serves the built site from.
-->
<link rel="icon" type="image/svg+xml" href="./mothership-logo.svg">

<!--
  Colour tokens for the chrome, in both modes. Generated from tokens.json
  alongside the components' stylesheet, so the sidebar cannot drift from what
  the canvas is painted with. .storybook/manager.ts mirrors the toolbar's
  Light / Dark choice onto <html> as data-theme, which is what selects between
  the two blocks in here.
-->
<link rel="stylesheet" href="./manager-tokens.css">

<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/inter-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('./fonts/inter-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('./fonts/inter-latin-600-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/inter-latin-700-normal.woff2') format('woff2');
  }

  /*
    The sidebar column: brand header, search field, filter row, explorer tree.

    Storybook pads this 16px 12px 20px and spaces the four blocks 16px apart.
    The horizontal padding is squared up to 16px so the column sits on the same
    inset as the rows inside it, the bottom matches the top rather than running
    4px deeper, and the blocks are given 24px of air so the search field reads
    as separate from the brand above it and the tree below.

    Targeted through the explorer menu's stable id rather than the column's own
    generated Emotion class, which changes between builds. It is the only
    element with #storybook-explorer-menu as a direct child.
  */
  #storybook-sidebar-region div:has(> #storybook-explorer-menu) {
    padding: 16px;
    row-gap: 24px;
  }

  /*
    The sidebar brand: logo mark, then the title at 18px, 12px apart.

    Targeted structurally rather than by class — Storybook's brand link carries
    a generated Emotion class that changes between builds. The skip link is a
    direct child of .sidebar-header; the brand sits one level deeper.

    The mark is a background-image rather than an <img> so that if
    public/mothership-logo.svg is missing the title still renders on its own,
    instead of showing a broken-image icon.
  */
  .sidebar-header > div > a {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    line-height: 28px;
    font-weight: 600;
    /* Set explicitly rather than from the scale: 20px is heading/sm, which
       tracks -0.2px, and -0.4px is heading/lg's value. */
    letter-spacing: -0.4px;
  }

  .sidebar-header > div > a::before {
    content: '';
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    /*
      Two layers so either file format works: whichever of the two exists is
      painted, and a 404 on one layer simply contributes nothing. Drop the mark
      into public/ as mothership-logo.svg (preferred — crisp at any size) or
      mothership-logo.png.
    */
    background-image: url('./mothership-logo.svg'), url('./mothership-logo.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  /*
    Chrome controls: hover and pressed.

    Storybook's defaults are the brand colour at 14% opacity for hover, which
    over a white sidebar reads as pale lilac, and a hardcoded #dbecff for
    pressed, which is a blue from its own palette rather than ours. Both are
    replaced with neutrals from the token set, one step apart.

    Applied across the whole sidebar region and the toolbar so that the section
    collapse buttons, the settings cog, the search filters and the toolbar
    icons all behave identically. Written against structural hooks rather than
    the generated Emotion classes, which change between builds.

    The selected row is excluded so it keeps its solid brand fill.
  */
  /*
    Colour as well as background. Storybook's rule for these is
    `color: #8429cc` on hover, so the settings cog and the section expanders
    turned brand purple — invisible against a dark sidebar and, in light, the
    same shouting the docs chrome was already told not to do. Both go to
    text/primary instead. The `[data-theme]` prefix is only there for weight:
    Storybook's rule is two classes and lands later in the document.
  */
  [data-theme] #storybook-sidebar-region button:hover,
  [data-theme] .sb-bar button:hover,
  [data-theme] #storybook-sidebar-region .sidebar-item:not([data-selected='true']):hover,
  [data-theme] #storybook-sidebar-region .sidebar-item:not([data-selected='true']):hover > a {
    background-color: var(--color-border-subtle);
    color: var(--color-text-primary);
  }

  [data-theme] #storybook-sidebar-region button:active,
  [data-theme] .sb-bar button:active,
  [data-theme] #storybook-sidebar-region .sidebar-item:not([data-selected='true']):active,
  [data-theme] #storybook-sidebar-region .sidebar-item:not([data-selected='true']):active > a {
    background-color: var(--color-border-default);
    color: var(--color-text-primary);
  }

  /* Icons follow the label rather than keeping a colour of their own. */
  [data-theme] #storybook-sidebar-region button:hover svg,
  [data-theme] .sb-bar button:hover svg,
  [data-theme] #storybook-sidebar-region button:active svg,
  [data-theme] .sb-bar button:active svg {
    color: inherit;
  }

  /*
    Root group headings — Foundations, Assets, Components.

    Storybook styles these as small, wide, muted, uppercase labels. They are
    instead treated as headings that sit in the same rhythm as the rows beneath
    them: same 14px size, same line height, same 4px radius, and padding
    mirroring a sidebar row apart from the indent, which roots do not have.
    Height was already 28px on both.

    Casing and tracking come off, so the labels read as written rather than
    shouted.
  */
  #storybook-explorer-tree button[data-action='collapse-root'] {
    font-size: 14px;
    font-weight: 600;
    line-height: normal;
    color: var(--color-text-primary);
    text-transform: none;
    letter-spacing: 0;
    border-radius: 4px;
    padding: 5px 6px 4px 8px;
  }

  /*
    Space between groups. Pinned at 16px rather than left to Storybook's
    default, which happens to be the same today. Scoped away from the first
    heading, which sits flush against the search field.
  */
  #storybook-explorer-tree .sidebar-subheading:not(:first-child) {
    margin-top: 16px;
  }
</style>

<style>
  /*
    The chrome itself, painted from the tokens.
    ------------------------------------------------------------------
    theme.ts hands Storybook a palette of literals once at startup, which is
    fine for one mode and cannot follow a toggle. So the surfaces that make up
    the frame are pointed at the token that already held their value.

    Nothing here is gated on [data-theme]: manager.ts always sets the attribute,
    manager-tokens.css declares both modes, and the variable does the switching.
    In light every one of these resolves to the literal theme.ts was already
    using, so the sidebar looks exactly as it did.

    Written against ids and structural classes rather than the generated Emotion
    ones, and one level deeper than Storybook's own rules so an equal-specificity
    tie does not hand it back.
  */
  /*
    Storybook paints the body from a global element rule injected after this
    block, so a plain `body` selector ties with it and loses. data-theme is on
    <html> and always set, so it doubles as the extra specificity needed.
  */
  [data-theme] body {
    background-color: var(--color-bg-default);
    color: var(--color-text-primary);
  }

  #storybook-sidebar-region,
  #storybook-panel-root,
  .sb-bar {
    background-color: var(--color-bg-default);
  }

  #storybook-explorer-menu,
  .sidebar-header > div > a {
    color: var(--color-text-primary);
  }

  /* The search field sits on the sidebar rather than in it. */
  #storybook-explorer-searchfield {
    background-color: var(--color-surface-default);
    border-color: var(--color-border-default);
    color: var(--color-text-primary);
  }

  #storybook-explorer-searchfield::placeholder {
    color: var(--color-text-muted);
  }

  /*
    The selected row keeps its solid brand fill, which is a different purple in
    each mode — light on dark, dark on light — so the label has to move with it
    rather than stay white.
  */
  #storybook-explorer-tree .sidebar-item[data-selected='true'],
  #storybook-explorer-tree .sidebar-item[data-selected='true'] > a {
    background-color: var(--color-action-primary-default);
    color: var(--color-text-on-brand);
  }

  /* Rules between the frame's regions. */
  .sb-bar,
  #storybook-sidebar-region {
    border-color: var(--color-border-subtle);
  }
</style>

<style>
  /*
    The sidebar tree.
    ------------------------------------------------------------------
    Rows carried Storybook's own #1f2429, set on .sidebar-item and inherited by
    the link inside, which in dark mode is near-black text on a near-black
    sidebar. The entry icons were worse: Storybook colour-codes them by story
    type, so they arrived as a teal that belongs to no part of this palette.

    Both now come from tokens. The icons are deliberately neutral in light as
    well as dark — the tree already separates entries by indentation and by icon
    shape, so the colour was carrying no information the layout did not, and a
    system whose first rule is that colour is never the only signal should not
    have a teal in its furniture.
  */
  [data-theme] #storybook-explorer-tree .sidebar-item,
  [data-theme] #storybook-explorer-tree .sidebar-item > a,
  [data-theme] #storybook-explorer-tree .sidebar-item > button {
    color: var(--color-text-primary);
  }

  [data-theme] #storybook-explorer-tree svg {
    color: var(--color-text-muted);
  }

  /* The selected row keeps its brand fill, so everything on it goes on-brand. */
  [data-theme] #storybook-explorer-tree .sidebar-item[data-selected='true'],
  [data-theme] #storybook-explorer-tree .sidebar-item[data-selected='true'] a,
  [data-theme] #storybook-explorer-tree .sidebar-item[data-selected='true'] button,
  [data-theme] #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
    color: var(--color-text-on-brand);
  }

  /*
    The row's context menu button.

    Storybook gives it a white fill and a 5px white glow, which is how it hides
    the truncated label underneath. The glow reads as a smudge in light and as a
    hole punched in the sidebar in dark, so it goes. Nothing is lost by that:
    the button only appears while its row is hovered, and the row's own fill
    does the masking.
  */
  [data-theme] #storybook-sidebar-region [aria-label='Open context menu'] {
    box-shadow: none;
    background-color: transparent;
    color: var(--color-text-secondary);
  }

  /*
    Its own three steps, one darker than the row's, so the button is
    distinguishable from the row it sits on rather than melting into it. These
    have to out-weigh the generic chrome hover, which is why the id is spelt out
    on each. Contrast of the glyph against its fill: 10.8:1 hovered and 3.4:1
    pressed in light, 8:1 and 3.6:1 in dark — the pressed pair are graphical
    rather than text, where 3:1 is the bar.
  */
  [data-theme] #storybook-sidebar-region [aria-label='Open context menu']:hover {
    background-color: var(--color-border-default);
    color: var(--color-text-primary);
  }

  [data-theme] #storybook-sidebar-region [aria-label='Open context menu']:active {
    background-color: var(--color-border-strong);
    color: var(--color-text-primary);
  }

  /* On the selected row it sits on the brand fill and takes its colour. */
  [data-theme] .sidebar-item[data-selected='true'] [aria-label='Open context menu'] {
    background-color: transparent;
    color: var(--color-text-on-brand);
  }

  /*
    The search field.

    Storybook draws it as a 1px inset ring rather than a border, and left to
    itself the ring stayed light grey while the field took a surface colour a
    step lighter than the sidebar — which in dark read as a filled box floating
    on the panel. The fill goes: the field sits flush on the sidebar with only
    the ring around it, which is what it looks like in light.
  */
  [data-theme] .search-field {
    box-shadow: inset 0 0 0 1px var(--color-border-default);
  }

  [data-theme] #storybook-explorer-searchfield {
    background-color: transparent;
  }

  [data-theme] #storybook-explorer-searchfield::placeholder {
    color: var(--color-text-muted);
  }

  /*
    The frame.

    The toolbar above the canvas kept a white background of its own, and the
    preview iframe's own background painted a white edge down the side of the
    canvas. The divide between sidebar and canvas is now an actual border rather
    than whatever happened to be behind it.
  */
  [data-theme] .sb-bar {
    background-color: var(--color-bg-default);
    border-color: var(--color-border-subtle);
    /*
      Storybook draws the toolbar's bottom edge as an inset shadow rather than a
      border, in the same light literal as everything else, so it stayed pale
      grey on a dark page. Restated with the token: same hairline, same colour
      as the sidebar's right edge, so the two edges of the frame match.
    */
    box-shadow: inset 0 -1px 0 0 var(--color-border-subtle);
  }

  [data-theme] #storybook-preview-iframe {
    background-color: var(--color-bg-default);
  }

  /*
    The frame's own rules.

    theme.ts hands Storybook a single appBorderColor literal, so every edge it
    draws stayed at the light-mode grey on a dark page — the bright line down
    the side of the canvas. Passing a var() there instead does not work:
    Storybook runs colour maths on that value and the manager fails to start.

    Three elements use it, and they are all frame furniture: the column holding
    the sidebar, the hairline under the preview, and the onboarding panel. They
    are named structurally, since the classes on them are generated. The
    sidebar's is matched with :has() as an ancestor rather than a parent — the
    bordered element is several levels above the region, not directly around it.
    Setting border-color on the others it also matches costs nothing, since a
    border with no width paints nothing.

    An earlier border of my own on #storybook-sidebar-region is gone with this:
    it sat directly against the column's, so the edge was drawing twice.
  */
  [data-theme] #root div:has(#storybook-sidebar-region),
  [data-theme] #root > div > div:last-child,
  [data-theme] div[id^='react-aria'] {
    border-color: var(--color-border-subtle);
  }
</style>

<style>
  /*
    Two more from the same sweep, both in the chrome.

      the active toolbar
      control                 Storybook paints it barSelectedColor, a darkened
                              brand — #6920a2 on the tinted bar was 2.09:1.
                              action/primary/default instead: 5.81:1 in light,
                              7.44:1 in dark, and still recognisably the brand.
                              Matched on our own aria-label rather than a
                              generated class, since we are the ones who named
                              the control.

      the ⌘K hint in search   #5c6570 on #0b0d0f was 3.29:1 -> text/muted, 9.3:1
  */
  /*
    Idle chrome buttons. Storybook's #666f78 is 3.81:1 on #0b0d0f — fine for an
    icon, where 3:1 is the bar, but short for the ones carrying text, such as
    the zoom level. text/muted holds #666f78 in light, so light is untouched,
    and #aeb4ba in dark, which is 9.3:1.

    Scoped to the toolbar and the sidebar header so it cannot reach the tree,
    whose rows are text/primary and whose root headings would otherwise tie with
    it and lose on document order.
  */
  [data-theme] .sb-bar button,
  [data-theme] .sidebar-header button {
    color: var(--color-text-muted);
  }

  [data-theme] .sb-bar button[aria-label^='Colour mode'] {
    color: var(--color-action-primary-default);
  }

  [data-theme] .search-field code,
  [data-theme] .search-field code span {
    color: var(--color-text-muted);
  }
</style>
