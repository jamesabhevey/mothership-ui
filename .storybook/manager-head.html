<!--
  Inter for Storybook's own chrome.

  The manager is a separate document from the preview iframe, so it does not
  get the @fontsource imports in preview.ts. The four weights are served from
  public/fonts via staticDirs, and referenced relatively so the built site
  works under the /mothership-ui/ path GitHub Pages serves it from.
-->
<!--
  Browser tab icon. Served from public/ via staticDirs and referenced
  relatively, so it resolves both locally and under the /mothership-ui/ path
  GitHub Pages serves the built site from.
-->
<link rel="icon" type="image/svg+xml" href="./mothership-logo.svg">

<!--
  Colour tokens for the chrome, in both modes. Generated from tokens.json
  alongside the components' stylesheet, so the sidebar cannot drift from what
  the canvas is painted with. .storybook/manager.ts mirrors the toolbar's
  Light / Dark choice onto <html> as data-theme, which is what selects between
  the two blocks in here.
-->
<link rel="stylesheet" href="./manager-tokens.css">

<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/inter-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('./fonts/inter-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('./fonts/inter-latin-600-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/inter-latin-700-normal.woff2') format('woff2');
  }

  /*
    The sidebar column: brand header, search field, filter row, explorer tree.

    Storybook pads this 16px 12px 20px and spaces the four blocks 16px apart.
    The horizontal padding is squared up to 16px so the column sits on the same
    inset as the rows inside it, the bottom matches the top rather than running
    4px deeper, and the blocks are given 24px of air so the search field reads
    as separate from the brand above it and the tree below.

    Targeted through the explorer menu's stable id rather than the column's own
    generated Emotion class, which changes between builds. It is the only
    element with #storybook-explorer-menu as a direct child.
  */
  #storybook-sidebar-region div:has(> #storybook-explorer-menu) {
    padding: 16px;
    row-gap: 24px;
  }

  /*
    The sidebar brand: logo mark, then the title at 18px, 12px apart.

    Targeted structurally rather than by class — Storybook's brand link carries
    a generated Emotion class that changes between builds. The skip link is a
    direct child of .sidebar-header; the brand sits one level deeper.

    The mark is a background-image rather than an <img> so that if
    public/mothership-logo.svg is missing the title still renders on its own,
    instead of showing a broken-image icon.
  */
  .sidebar-header > div > a {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    line-height: 28px;
    font-weight: 600;
    /* Set explicitly rather than from the scale: 20px is heading/sm, which
       tracks -0.2px, and -0.4px is heading/lg's value. */
    letter-spacing: -0.4px;
  }

  .sidebar-header > div > a::before {
    content: '';
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    /*
      Two layers so either file format works: whichever of the two exists is
      painted, and a 404 on one layer simply contributes nothing. Drop the mark
      into public/ as mothership-logo.svg (preferred — crisp at any size) or
      mothership-logo.png.
    */
    background-image: url('./mothership-logo.svg'), url('./mothership-logo.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  /*
    Chrome controls: hover and pressed.

    Storybook's defaults are the brand colour at 14% opacity for hover, which
    over a white sidebar reads as pale lilac, and a hardcoded #dbecff for
    pressed, which is a blue from its own palette rather than ours. Both are
    replaced with neutrals from the token set, one step apart.

    Applied across the whole sidebar region and the toolbar so that the section
    collapse buttons, the settings cog, the search filters and the toolbar
    icons all behave identically. Written against structural hooks rather than
    the generated Emotion classes, which change between builds.

    The selected row is excluded so it keeps its solid brand fill.
  */
  #storybook-sidebar-region button:hover,
  .sb-bar button:hover,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):hover,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):hover > a {
    background-color: var(--color-border-subtle);
  }

  #storybook-sidebar-region button:active,
  .sb-bar button:active,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):active,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):active > a {
    background-color: var(--color-border-default);
  }

  /*
    Root group headings — Foundations, Assets, Components.

    Storybook styles these as small, wide, muted, uppercase labels. They are
    instead treated as headings that sit in the same rhythm as the rows beneath
    them: same 14px size, same line height, same 4px radius, and padding
    mirroring a sidebar row apart from the indent, which roots do not have.
    Height was already 28px on both.

    Casing and tracking come off, so the labels read as written rather than
    shouted.
  */
  #storybook-explorer-tree button[data-action='collapse-root'] {
    font-size: 14px;
    font-weight: 600;
    line-height: normal;
    color: var(--color-text-primary);
    text-transform: none;
    letter-spacing: 0;
    border-radius: 4px;
    padding: 5px 6px 4px 8px;
  }

  /*
    Space between groups. Pinned at 16px rather than left to Storybook's
    default, which happens to be the same today. Scoped away from the first
    heading, which sits flush against the search field.
  */
  #storybook-explorer-tree .sidebar-subheading:not(:first-child) {
    margin-top: 16px;
  }
</style>

<style>
  /*
    The chrome itself, painted from the tokens.
    ------------------------------------------------------------------
    theme.ts hands Storybook a palette of literals once at startup, which is
    fine for one mode and cannot follow a toggle. So the surfaces that make up
    the frame are pointed at the token that already held their value.

    Nothing here is gated on [data-theme]: manager.ts always sets the attribute,
    manager-tokens.css declares both modes, and the variable does the switching.
    In light every one of these resolves to the literal theme.ts was already
    using, so the sidebar looks exactly as it did.

    Written against ids and structural classes rather than the generated Emotion
    ones, and one level deeper than Storybook's own rules so an equal-specificity
    tie does not hand it back.
  */
  /*
    Storybook paints the body from a global element rule injected after this
    block, so a plain `body` selector ties with it and loses. data-theme is on
    <html> and always set, so it doubles as the extra specificity needed.
  */
  [data-theme] body {
    background-color: var(--color-bg-default);
    color: var(--color-text-primary);
  }

  #storybook-sidebar-region,
  #storybook-panel-root,
  .sb-bar {
    background-color: var(--color-bg-default);
  }

  #storybook-explorer-menu,
  .sidebar-header > div > a {
    color: var(--color-text-primary);
  }

  /* The search field sits on the sidebar rather than in it. */
  #storybook-explorer-searchfield {
    background-color: var(--color-surface-default);
    border-color: var(--color-border-default);
    color: var(--color-text-primary);
  }

  #storybook-explorer-searchfield::placeholder {
    color: var(--color-text-muted);
  }

  /*
    The selected row keeps its solid brand fill, which is a different purple in
    each mode — light on dark, dark on light — so the label has to move with it
    rather than stay white.
  */
  #storybook-explorer-tree .sidebar-item[data-selected='true'],
  #storybook-explorer-tree .sidebar-item[data-selected='true'] > a {
    background-color: var(--color-action-primary-default);
    color: var(--color-text-on-brand);
  }

  /* Rules between the frame's regions. */
  .sb-bar,
  #storybook-sidebar-region {
    border-color: var(--color-border-subtle);
  }
</style>
