<!--
  Inter for Storybook's own chrome.

  The manager is a separate document from the preview iframe, so it does not
  get the @fontsource imports in preview.ts. The four weights are served from
  public/fonts via staticDirs, and referenced relatively so the built site
  works under the /mothership-ui/ path GitHub Pages serves it from.
-->
<!--
  Browser tab icon. Served from public/ via staticDirs and referenced
  relatively, so it resolves both locally and under the /mothership-ui/ path
  GitHub Pages serves the built site from.
-->
<link rel="icon" type="image/svg+xml" href="./mothership-logo.svg">

<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/inter-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('./fonts/inter-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('./fonts/inter-latin-600-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/inter-latin-700-normal.woff2') format('woff2');
  }

  /*
    The sidebar brand: logo mark, then the title at 18px, 12px apart.

    Targeted structurally rather than by class — Storybook's brand link carries
    a generated Emotion class that changes between builds. The skip link is a
    direct child of .sidebar-header; the brand sits one level deeper.

    The mark is a background-image rather than an <img> so that if
    public/mothership-logo.svg is missing the title still renders on its own,
    instead of showing a broken-image icon.
  */
  .sidebar-header > div > a {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    line-height: 28px;
    font-weight: 600;
    /* Set explicitly rather than from the scale: 20px is heading/sm, which
       tracks -0.2px, and -0.4px is heading/lg's value. */
    letter-spacing: -0.4px;
  }

  .sidebar-header > div > a::before {
    content: '';
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    /*
      Two layers so either file format works: whichever of the two exists is
      painted, and a 404 on one layer simply contributes nothing. Drop the mark
      into public/ as mothership-logo.svg (preferred — crisp at any size) or
      mothership-logo.png.
    */
    background-image: url('./mothership-logo.svg'), url('./mothership-logo.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }

  /*
    Chrome controls: hover and pressed.

    Storybook's defaults are the brand colour at 14% opacity for hover, which
    over a white sidebar reads as pale lilac, and a hardcoded #dbecff for
    pressed, which is a blue from its own palette rather than ours. Both are
    replaced with neutrals from the token set, one step apart.

    Applied across the whole sidebar region and the toolbar so that the section
    collapse buttons, the settings cog, the search filters and the toolbar
    icons all behave identically. Written against structural hooks rather than
    the generated Emotion classes, which change between builds.

    The selected row is excluded so it keeps its solid brand fill.
  */
  #storybook-sidebar-region button:hover,
  .sb-bar button:hover,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):hover,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):hover > a {
    background-color: #e8eaec;
  }

  #storybook-sidebar-region button:active,
  .sb-bar button:active,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):active,
  #storybook-sidebar-region .sidebar-item:not([data-selected='true']):active > a {
    background-color: #d3d7db;
  }

  /*
    Root group headings — Foundations, Assets, Components.

    Storybook styles these as small, wide, muted, uppercase labels. They are
    instead treated as headings that sit in the same rhythm as the rows beneath
    them: same 14px size, same line height, same 4px radius, and padding
    mirroring a sidebar row apart from the indent, which roots do not have.
    Height was already 28px on both.

    Casing and tracking come off, so the labels read as written rather than
    shouted.
  */
  #storybook-explorer-tree button[data-action='collapse-root'] {
    font-size: 14px;
    font-weight: 600;
    line-height: normal;
    color: #1f2429;
    text-transform: none;
    letter-spacing: 0;
    border-radius: 4px;
    padding: 5px 6px 4px 8px;
  }

  /*
    Space between groups. Pinned at 16px rather than left to Storybook's
    default, which happens to be the same today. Scoped away from the first
    heading, which sits flush against the search field.
  */
  #storybook-explorer-tree .sidebar-subheading:not(:first-child) {
    margin-top: 16px;
  }
</style>
